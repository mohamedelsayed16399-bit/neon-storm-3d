   if(e.cd<=0){e.cd=e.hp<e.max*.4?.16:.26;e.sa=(e.sa||0)+.5;for(let k=0;k<2;k++){const a=e.sa+k*Math.PI;const m=new THREE.Mesh(bGeo,ebMat);m.scale.setScalar(1.3);m.position.set(e.x,2,e.z);scene.add(m);
    ebul.push({m,x:e.x,z:e.z,vx:Math.sin(a)*9,vz:Math.cos(a)*9,l:4.5,d:12})}}
   if(e.sm<=0&&enemies.length<14){e.sm=e.hp<e.max*.4?3:5;for(let k=0;k<3;k++)spawn(k==0&&level>=20?"shooter":"chaser")}}
  if(e.t=="bossB"){e.cd-=dt;if(e.cd<=0){e.cd=e.hp<e.max*.4?.8:1.3;
   for(let i=0;i<3;i++){const a=Math.atan2(dx,dz)+(i-1)*.25;const m=new THREE.Mesh(bGeo,ebMat);m.scale.setScalar(1.5);m.position.set(e.x,2,e.z);scene.add(m);
    ebul.push({m,x:e.x,z:e.z,vx:Math.sin(a)*12,vz:Math.cos(a)*12,l:4,d:14})}
   if(e.hp<e.max*.5)for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const m=new THREE.Mesh(bGeo,ebMat);m.scale.setScalar(1.3);m.position.set(e.x,2,e.z);scene.add(m);
    ebul.push({m,x:e.x,z:e.z,vx:Math.sin(a)*7,vz:Math.cos(a)*7,l:5,d:12})}}}
 }
 for(const e of enemies)if(e.hp<=0)killEnemy(e);
 enemies=enemies.filter(e=>e.hp>0);
 // gems
 for(const g of gems){const dx=P.x-g.x,dz=P.z-g.z,d=Math.hypot(dx,dz)||1;
  if(d<6+P.mag||(g.kind&&d<9)){g.vx+=dx/d*40*dt;g.vz+=dz/d*40*dt}
  g.x+=g.vx*dt;g.z+=g.vz*dt;g.vx*=.92;g.vz*=.92;
  g.m.position.set(g.x,1+Math.sin(t/150+g.x)*.2,g.z);g.m.rotation.y+=dt*4;
  if(g.kind&&(g.life-=dt)<=0)g.dead=true;
  if(d<1.1&&g.kind){g.dead=true;SFX.up();if(g.kind=="heal"){P.hp=Math.min(P.max,P.hp+P.max*.25);say("+ صحة",null,600)}else{P.inv=Math.max(P.inv,4);say("درع!",null,600)}boom(g.x,1,g.z,g.kind=="heal"?0xff4466:0x44ffff,10,4);ringFX(g.x,g.z,0xffffff)}
  else if(d<1.1){g.dead=true;SFX.gem();P.dashCd=Math.max(0,P.dashCd-.25);score+=5;boom(g.x,1,g.z,0x00ff99,3,2)}}
 gems=gems.filter(g=>{if(g.dead){scene.remove(g.m);return false}return true});
 // particles
 for(const p of parts){p.l-=dt;
  if(p.ring){p.m.scale.setScalar(p.s+=(1-p.l/.35)*8);p.m.material.opacity=Math.max(0,p.l/.35)}
  else{p.vy-=14*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.1,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;p.m.scale.setScalar(Math.max(.01,p.l*1.6*p.s))}}
 parts=parts.filter(p=>{if(p.l<=0){scene.remove(p.m);p.m.material.dispose();return false}return true});
 muzzle.material.opacity*=.8;if(muzzle.material.opacity<.2)muzzle.visible=false;
 // hud
 $("hp").firstChild.style.width=P.hp/P.max*100+"%";$("hpt").textContent=AR(P.hp)+" / "+AR(P.max);
 $("lv").textContent="المرحلة "+AR(level);$("sc").textContent=AR(score);
 $("combo").textContent=combo>=2?"سلسلة ×"+AR(combo):"";
 $("lowhp").style.display=P.hp<P.max*.3?"block":"none";
}
let last=performance.now(),camY=15,camZ=10,paused=false,vt=performance.now();
function setPaused(p){if(state!="play"&&p)return;if(p===paused)return;paused=p;$("pz").classList.toggle("on",p);$("pause").textContent=p?"▶":"⏸";
 if(p){jid=null;joy.x=joy.y=0;kn.style.left=kn.style.top="40px";$("pzs").textContent="المرحلة "+AR(level)+" · النقاط "+AR(score)+" · قتلى "+AR(kills)+(P?" · صحة "+AR(Math.max(0,P.hp)):"")}else{dashReq=false}}
$("pause").onclick=()=>setPaused(!paused);$("resume").onclick=()=>setPaused(false);
addEventListener("keydown",e=>{if(e.key=="Escape"||e.key=="p"||e.key=="P")setPaused(!paused)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)setPaused(true)});
function frame(t){
 const dt=paused?0:Math.min(.05,(t-last)/1000);last=t;
 if(!paused)vt+=dt*1000;
 $("pause").style.display=(state=="play"||paused)?"block":"none";
 if(!paused)update(dt,vt);
 // ambient animation
 gridFar.position.x=(t/140)%8;gridFar.position.z=(t/170)%8;
 for(let i=0;i<rocks.length;i++){const rk=rocks[i];rk.rotation.x+=rk.userData.rx*dt;rk.rotation.y+=rk.userData.ry*dt;
  rk.position.y=rk.userData.by+Math.sin(t/900+rk.userData.bob)*1.2}
 for(let i=0;i<pillarMats.length;i++)pillarMats[i].emissiveIntensity=.5+Math.sin(t/500+i)*.3;
 for(const n of nebs)n.material.opacity=.28+Math.sin(t/2000+n.position.x)*.1;
 if(P){ring.position.set(P.x,.05,P.z);ring.scale.setScalar(1+Math.sin(t/200)*.15);
  const bob=P.dashT>0?0:Math.sin(t/300)*.12;
  ship.position.set(P.x,1+bob,P.z);
  ship.rotation.y+=((P.face-ship.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*Math.min(1,dt*14);
  ship.rotation.z=((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x)*-.35;
  ship.rotation.x=((keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y)*.2;
  const es=1.2+Math.sin(t/60)*.3+(P.dashT>0?1.4:0);eng1.scale.setScalar(es);eng2.scale.setScalar(es);
  ship.visible=P.inv<=0||Math.floor(t/60)%2==0;
  glow.intensity=24+Math.sin(t/100)*4}
 shake=Math.max(0,shake-dt*2.2);
 const px=P?P.x:0,pz=P?P.z:0;
 cam.position.set(px+(Math.random()-.5)*shake,camY+shake*.5,pz+camZ+(Math.random()-.5)*shake);
 cam.lookAt(px,0,pz-1);
 renderer.render(scene,cam);requestAnimationFrame(frame);
}
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;const port=innerWidth<innerHeight;cam.fov=port?66:55;camY=port?19:15;camZ=port?12.5:10;cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
const st=$("stick"),kn=$("knob");let jid=null;
if("ontouchstart" in window||navigator.maxTouchPoints>0)document.body.classList.add("touch");
function jmove(e){const r=st.getBoundingClientRect(),cx=r.left+65,cy=r.top+65;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=55;if(d>m){dx=dx/d*m;dy=dy/d*m}kn.style.left=40+dx+"px";kn.style.top=40+dy+"px";joy.x=dx/m;joy.y=dy/m}
st.addEventListener("pointerdown",e=>{jid=e.pointerId;st.setPointerCapture(jid);jmove(e)});
st.addEventListener("pointermove",e=>{if(e.pointerId==jid)jmove(e)});
const jend=e=>{if(e.pointerId==jid){jid=null;joy.x=joy.y=0;kn.style.left=kn.style.top="40px"}};
st.addEventListener("pointerup",jend);st.addEventListener("pointercancel",jend);
$("dash").addEventListener("pointerdown",()=>dashReq=true);
$("go").onclick=()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}$("start").classList.remove("on");newGame()};
$("achb").onclick=showAch;$("achb2").onclick=showAch;
$("again").onclick=()=>{$("over").classList.remove("on");newGame()};
window.SC=scene;window.G={ST:()=>ST,AH:()=>AH,chk:chkAch,over:()=>gameOver(),blades:()=>blades.length,P:()=>P,get s(){return{state,level,score,kills,hp:P&&P.hp,en:enemies.length,q:toSpawn&&toSpawn.length,bul:bullets.length,gems:gems.length,combo,gl:renderer.getContext().constructor.name,fps:Math.round(1/Math.max(.001,(performance.now()-last)/1000))}},
 spawn:t=>spawn(t),cheat(){if(P){P.dmg=500;P.hp=P.max=9999}},start:()=>$("go").click(),
 pick:()=>{const b=document.querySelector(".card");b&&b.click()},stand(x,z){P.x=x;P.z=z},
 kill(){enemies.forEach(e=>e.hp=0)},sethp(v){P.hp=v;P.inv=0},hitme(d){P.inv=0;hurt(d)},jump(n){enemies.forEach(e=>scene.remove(e.grp));enemies=[];toSpawn=[];level=n-1;nextLevel()}};
requestAnimationFrame(frame);
</script>
