<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<title>عاصفة النيون - Neon Storm 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#05010f;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 0 8px #0ff}
#hp{width:42vw;max-width:220px;height:14px;border:2px solid #0ff;border-radius:8px;overflow:hidden;background:#0006}
#hp i{display:block;height:100%;background:linear-gradient(90deg,#f0f,#0ff);width:100%}
#xp{margin-top:6px;font-size:14px;opacity:.9}
.r{text-align:left;font-size:18px;font-weight:700}
#msg{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;text-shadow:0 0 20px #f0f;pointer-events:none;opacity:0;transition:opacity .4s}
.ov{position:fixed;inset:0;background:radial-gradient(#1a0536dd,#05010fee);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:5}
.ov.on{display:flex}
.ov h1{font-size:44px;margin:0;color:#0ff;text-shadow:0 0 24px #0ff,0 0 48px #f0f}
.ov p{margin:0;color:#c9b8ff;max-width:420px;line-height:1.7}
.btn{background:linear-gradient(90deg,#f0f,#0ff);color:#05010f;border:0;border-radius:40px;padding:16px 44px;font-size:22px;font-weight:900;font-family:inherit;box-shadow:0 0 30px #f0f8;pointer-events:auto}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:150px;background:#12062a;border:2px solid #0ff;border-radius:16px;padding:14px 8px;color:#fff;font-family:inherit;font-size:15px;box-shadow:0 0 18px #0ff5}
.card b{display:block;font-size:34px;margin-bottom:4px}
#stick{position:fixed;left:18px;bottom:22px;width:130px;height:130px;border-radius:50%;border:2px solid #0ff6;background:#0ff1;display:none}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#0ffa;box-shadow:0 0 14px #0ff}
#dash{position:fixed;right:22px;bottom:34px;width:92px;height:92px;border-radius:50%;border:3px solid #f0f;background:#f0f3;color:#fff;font-size:17px;font-weight:800;display:none;font-family:inherit}
body.touch #stick,body.touch #dash{display:block}
</style>
</head>
<body>
<div id="hud"><div><div id="hp"><i></i></div><div id="xp"></div></div><div class="r"><div id="lv"></div><div id="sc"></div></div></div>
<div id="msg"></div>
<div id="stick"><div id="knob"></div></div>
<button id="dash">اندفاع</button>
<div class="ov on" id="start"><h1>عاصفة النيون</h1><p>سفينتك بتضرب أوتوماتيك أقرب عدو. حرّك بالعصا (أو WASD)، واندفع بالزر (أو المسطرة). اخلّص كل موجة، اختار تطوير، وواجه زعيم كل ٥ مراحل.</p><button class="btn" id="go">ابدأ</button></div>
<div class="ov" id="up"><h1 style="font-size:32px">اختار تطوير</h1><div class="cards" id="cards"></div></div>
<div class="ov" id="over"><h1 style="color:#f55;text-shadow:0 0 24px #f00">انتهت اللعبة</h1><p id="fin"></p><button class="btn" id="again">العب تاني</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const $=id=>document.getElementById(id);
const AR=n=>Math.round(n).toLocaleString("ar-EG",{useGrouping:false});
const R=(a,b)=>a+Math.random()*(b-a);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x05010f);scene.fog=new THREE.Fog(0x05010f,28,70);
const cam=new THREE.PerspectiveCamera(55,1,.1,200);
scene.add(new THREE.AmbientLight(0x6644aa,1.2));
const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(10,25,8);scene.add(sun);
const ARENA=26;
const grid=new THREE.GridHelper(ARENA*2,26,0xff00ff,0x1a6a8a);grid.position.y=.01;scene.add(grid);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2,ARENA*2),new THREE.MeshBasicMaterial({color:0x0a0420}));floor.rotation.x=-Math.PI/2;scene.add(floor);
{const m=new THREE.MeshBasicMaterial({color:0x00ffff});for(let i=0;i<4;i++){const w=new THREE.Mesh(new THREE.BoxGeometry(i<2?ARENA*2:.3,.35,i<2?.3:ARENA*2),m);w.position.set(i<2?0:(i==2?-ARENA:ARENA),.18,i<2?(i?ARENA:-ARENA):0);scene.add(w)}}
// pillars decor
const pm=new THREE.MeshStandardMaterial({color:0x2a0a5a,emissive:0x5511aa,emissiveIntensity:.6});
const pillars=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r=R(8,20);const p=new THREE.Mesh(new THREE.BoxGeometry(2,R(2,5),2),pm);p.position.set(Math.cos(a)*r,p.geometry.parameters.height/2,Math.sin(a)*r);scene.add(p);pillars.push(p);const ed=new THREE.LineSegments(new THREE.EdgesGeometry(p.geometry),new THREE.LineBasicMaterial({color:0xff00ff}));ed.position.copy(p.position);scene.add(ed)}
const sg=new THREE.BufferGeometry(),sp=[];for(let i=0;i<500;i++)sp.push(R(-90,90),R(10,60),R(-90,90));sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.5,fog:false})));
const ring=new THREE.Mesh(new THREE.RingGeometry(1.3,1.5,32),new THREE.MeshBasicMaterial({color:0x00ffff,side:2,transparent:true,opacity:.6}));ring.rotation.x=-Math.PI/2;ring.position.y=.05;scene.add(ring);
// player
const ship=new THREE.Group();
ship.add(new THREE.Mesh(new THREE.ConeGeometry(.7,1.8,4),new THREE.MeshStandardMaterial({color:0x00ffff,emissive:0x00aaff,emissiveIntensity:1})));
ship.children[0].rotation.x=Math.PI/2;
const wing=new THREE.Mesh(new THREE.BoxGeometry(2,.15,.7),new THREE.MeshStandardMaterial({color:0xff00ff,emissive:0xff00ff,emissiveIntensity:1}));wing.position.z=.5;ship.add(wing);
const glow=new THREE.PointLight(0x00ffff,30,14);glow.position.y=2;ship.add(glow);
scene.add(ship);
// pools
const bGeo=new THREE.SphereGeometry(.22,6,6),pbMat=new THREE.MeshBasicMaterial({color:0x66ffff}),ebMat=new THREE.MeshBasicMaterial({color:0xff4488});
const pGeo=new THREE.BoxGeometry(.25,.25,.25);
const eGeo={chaser:new THREE.OctahedronGeometry(.8),shooter:new THREE.IcosahedronGeometry(.8),tank:new THREE.BoxGeometry(1.8,1.8,1.8),boss:new THREE.DodecahedronGeometry(2.6)};
const eCol={chaser:0xff3355,shooter:0xaa44ff,tank:0xff9900,boss:0xff0000};
const eMat={};for(const k in eCol)eMat[k]=new THREE.MeshStandardMaterial({color:eCol[k],emissive:eCol[k],emissiveIntensity:.8,flatShading:true});
let P,bullets=[],ebul=[],enemies=[],parts=[],level,score,kills,toSpawn,spawnT,state="menu",shake=0,msgT=0;
const keys={};let joy={x:0,y:0},dashReq=false;
function newGame(){
  for(const a of [bullets,ebul,enemies,parts])a.forEach(o=>scene.remove(o.m));bullets=[];ebul=[];enemies=[];parts=[];
  P={x:0,z:0,hp:100,max:100,dmg:10,rate:3.2,spd:9,multi:1,dashCd:0,dashT:0,inv:0,cd:0,face:0,regen:0,pierce:0};
  level=0;score=0;kills=0;nextLevel();state="play";
}
function say(t,ms=1800){const m=$("msg");m.textContent=t;m.style.opacity=1;msgT=ms/1000}
function nextLevel(){
  level++;const boss=level%5==0;
  toSpawn=[];const n=4+level*2;
  for(let i=0;i<n;i++){const r=Math.random();toSpawn.push(r<.15+level*.02?"tank":r<.4+level*.03?"shooter":"chaser")}
  if(boss)toSpawn.push("boss");
  spawnT=1;say(boss?"⚠ زعيم المرحلة "+AR(level):"المرحلة "+AR(level));
}
function spawn(t){
  const a=Math.random()*Math.PI*2,x=Math.max(-ARENA+2,Math.min(ARENA-2,P.x+Math.cos(a)*17)),z=Math.max(-ARENA+2,Math.min(ARENA-2,P.z+Math.sin(a)*17));
  const hp={chaser:20,shooter:28,tank:90,boss:600}[t]*(1+level*.12);
  const m=new THREE.Mesh(eGeo[t],eMat[t]);m.position.set(x,t=="boss"?2.6:1,z);scene.add(m);
  enemies.push({m,t,x,z,hp,max:hp,spd:{chaser:4.2,shooter:2.6,tank:2,boss:2.2}[t]*(1+level*.02),cd:R(1,3),r:{chaser:.9,shooter:.9,tank:1.3,boss:2.6}[t],hit:0});
}
function boom(x,y,z,col,n=10,sp=6){
  for(let i=0;i<n&&parts.length<260;i++){const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:col}));m.position.set(x,y,z);scene.add(m);
    parts.push({m,vx:R(-sp,sp),vy:R(1,sp),vz:R(-sp,sp),l:R(.4,.8)})}
}
function nearest(){let b=null,d=1e9;for(const e of enemies){const q=(e.x-P.x)**2+(e.z-P.z)**2;if(q<d){d=q;b=e}}return b&&d<26*26?b:null}
function shoot(dx,dz,dmg){const m=new THREE.Mesh(bGeo,pbMat);m.position.set(P.x,1,P.z);scene.add(m);bullets.push({m,x:P.x,z:P.z,vx:dx*26,vz:dz*26,l:1.1,dmg,pierce:P.pierce})}
function hurt(d){if(P.inv>0||state!="play")return;P.hp-=d;P.inv=.5;shake=.4;boom(P.x,1,P.z,0xff0044,8);if(P.hp<=0){P.hp=0;gameOver()}}
function gameOver(){state="over";$("fin").textContent="وصلت المرحلة "+AR(level)+" · نقاطك "+AR(score)+" · قتلت "+AR(kills);$("over").classList.add("on")}
const UPS=[["🔫","ضرر +٣٥٪",()=>P.dmg*=1.35],["⚡","سرعة ضرب +٣٠٪",()=>P.rate*=1.3],["🔱","طلقة إضافية",()=>P.multi=Math.min(5,P.multi+1)],["❤️","صحة +٤٠ وعلاج",()=>{P.max+=40;P.hp=P.max}],["👟","سرعة حركة +١٥٪",()=>P.spd*=1.15],["🩸","شفاء بطيء مستمر",()=>P.regen+=1.5],["💥","طلقات تخترق الأعداء",()=>P.pierce+=1]];
function showUp(){state="up";const c=$("cards");c.innerHTML="";
  [...UPS].sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{const b=document.createElement("button");b.className="card";b.innerHTML="<b>"+u[0]+"</b>"+u[1];b.onclick=()=>{u[2]();$("up").classList.remove("on");nextLevel();state="play"};c.appendChild(b)});
  $("up").classList.add("on")}
function update(dt){
  if(msgT>0){msgT-=dt;if(msgT<=0)$("msg").style.opacity=0}
  if(state!="play")return;
  let mx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml}
  if((dashReq||keys[" "])&&P.dashCd<=0){P.dashCd=1.6;P.dashT=.18;P.inv=.3;if(ml<.1){mx=Math.sin(P.face);mz=Math.cos(P.face)}else{}P.dx=ml>.1?mx/Math.max(ml,1):Math.sin(P.face);P.dz=ml>.1?mz/Math.max(ml,1):Math.cos(P.face)}
  dashReq=false;P.dashCd-=dt;P.inv-=dt;
  let sp=P.spd;if(P.dashT>0){P.dashT-=dt;mx=P.dx;mz=P.dz;sp=32}
  P.x=Math.max(-ARENA+1,Math.min(ARENA-1,P.x+mx*sp*dt));P.z=Math.max(-ARENA+1,Math.min(ARENA-1,P.z+mz*sp*dt));
  if(ml>.1)P.face=Math.atan2(mx,mz);
  P.hp=Math.min(P.max,P.hp+P.regen*dt);
  // fire
  P.cd-=dt;const tg=nearest();
  if(tg){const dx=tg.x-P.x,dz=tg.z-P.z,d=Math.hypot(dx,dz)||1;P.face=Math.atan2(dx,dz);
    if(P.cd<=0){P.cd=1/P.rate;const base=Math.atan2(dx,dz),n=P.multi;for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.16;shoot(Math.sin(a),Math.cos(a),P.dmg)}}}
  // spawn
  if(toSpawn.length){spawnT-=dt;if(spawnT<=0){spawn(toSpawn.shift());spawnT=Math.max(.35,1.2-level*.05)}}
  else if(!enemies.length&&state=="play"){score+=level*50;showUp()}
  // bullets
  for(const b of bullets){b.x+=b.vx*dt;b.z+=b.vz*dt;b.l-=dt;b.m.position.set(b.x,1,b.z);
    for(const e of enemies){if(e.hp>0&&!b.dead&&(b.x-e.x)**2+(b.z-e.z)**2<(e.r+.3)**2&&b.last!==e){e.hp-=b.dmg;e.hit=.1;b.last=e;boom(b.x,1,b.z,0xffffff,2,3);if(b.pierce>0)b.pierce--;else b.dead=true}}}
  bullets=bullets.filter(b=>{if(b.l<=0||b.dead){scene.remove(b.m);return false}return true});
  for(const b of ebul){b.x+=b.vx*dt;b.z+=b.vz*dt;b.l-=dt;b.m.position.set(b.x,1,b.z);if((b.x-P.x)**2+(b.z-P.z)**2<1){hurt(b.d);b.l=0}}
  ebul=ebul.filter(b=>{if(b.l<=0){scene.remove(b.m);return false}return true});
  // enemies
  for(const e of enemies){
    const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz)||1;
    let want=e.t=="shooter"?(d>11?1:d<7?-1:0):1;
    e.x+=dx/d*e.spd*want*dt;e.z+=dz/d*e.spd*want*dt;
    e.m.position.set(e.x,e.t=="boss"?2.6:1,e.z);e.m.rotation.y+=dt*(e.t=="boss"?1:2);e.m.rotation.x+=dt;
    e.m.scale.setScalar(e.hit>0?1.15:1);e.hit-=dt;
    if(d<e.r+.7)hurt(e.t=="boss"?25:e.t=="tank"?18:10);
    if(e.t=="shooter"||e.t=="boss"){e.cd-=dt;if(e.cd<=0){e.cd=e.t=="boss"?1.1:2.2;const n=e.t=="boss"?8:1;
      for(let i=0;i<n;i++){const a=e.t=="boss"?i/n*Math.PI*2+e.m.rotation.y:Math.atan2(dx,dz);const m=new THREE.Mesh(bGeo,ebMat);m.scale.setScalar(1.4);scene.add(m);ebul.push({m,x:e.x,z:e.z,vx:Math.sin(a)*9,vz:Math.cos(a)*9,l:4,d:e.t=="boss"?14:9})}}}
  }
  for(const e of enemies)if(e.hp<=0){boom(e.x,1,e.z,eCol[e.t],e.t=="boss"?60:14);score+=({chaser:10,shooter:20,tank:40,boss:500})[e.t];kills++;scene.remove(e.m);shake=e.t=="boss"?1:.15}
  enemies=enemies.filter(e=>e.hp>0);
  for(const p of parts){p.l-=dt;p.vy-=14*dt;p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(.1,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;p.m.scale.setScalar(Math.max(.01,p.l*1.6))}
  parts=parts.filter(p=>{if(p.l<=0){scene.remove(p.m);p.m.material.dispose();return false}return true});
  // hud
  $("hp").firstChild.style.width=P.hp/P.max*100+"%";
  $("lv").textContent="المرحلة "+AR(level);$("sc").textContent=AR(score);
  $("xp").textContent="أعداء: "+AR(enemies.length+toSpawn.length);
}
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  update(dt);
  if(P){ring.position.set(P.x,.05,P.z);ring.scale.setScalar(1+Math.sin(t/200)*.15);ship.position.set(P.x,1,P.z);ship.rotation.y=P.face;ship.visible=P.inv<=0||Math.floor(t/60)%2==0}
  shake=Math.max(0,shake-dt*2);
  const px=P?P.x:0,pz=P?P.z:0;
  cam.position.set(px+(Math.random()-.5)*shake,15,pz+10+(Math.random()-.5)*shake);cam.lookAt(px,0,pz-1);
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?70:55;cam.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=1);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
// touch joystick
const st=$("stick"),kn=$("knob");let jid=null;
if("ontouchstart" in window||navigator.maxTouchPoints>0)document.body.classList.add("touch");
function jmove(e){const r=st.getBoundingClientRect(),cx=r.left+65,cy=r.top+65;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=55;if(d>m){dx=dx/d*m;dy=dy/d*m}kn.style.left=40+dx+"px";kn.style.top=40+dy+"px";joy.x=dx/m;joy.y=dy/m}
st.addEventListener("pointerdown",e=>{jid=e.pointerId;st.setPointerCapture(jid);jmove(e)});
st.addEventListener("pointermove",e=>{if(e.pointerId==jid)jmove(e)});
const jend=e=>{if(e.pointerId==jid){jid=null;joy.x=joy.y=0;kn.style.left=kn.style.top="40px"}};
st.addEventListener("pointerup",jend);st.addEventListener("pointercancel",jend);
$("dash").addEventListener("pointerdown",()=>dashReq=true);
$("go").onclick=()=>{$("start").classList.remove("on");newGame()};
$("again").onclick=()=>{$("over").classList.remove("on");newGame()};
window.G={get s(){return{state,level,score,kills,hp:P&&P.hp,en:enemies.length,q:toSpawn&&toSpawn.length,bul:bullets.length,gl:renderer.getContext().constructor.name}},spawn:t=>spawn(t),cheat(){if(P){P.dmg=500;P.hp=P.max=9999}},start:()=>$("go").click(),pick:()=>{const b=document.querySelector(".card");b&&b.click()},stand(x,z){P.x=x;P.z=z},kill(){enemies.forEach(e=>e.hp=0)},jump(n){enemies.forEach(e=>scene.remove(e.m));enemies=[];level=n-1;nextLevel()}};
requestAnimationFrame(frame);
</script>
</body>
</html>
